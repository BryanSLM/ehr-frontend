name: Deploy to VPS

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          source: .
          target: ~/ehr-frontend

      - name: SSH and run Docker
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd ~/ehr-frontend
            docker stop ehr-frontend || true
            docker rm ehr-frontend || true
            docker build -t ehr-frontend .
            docker run -d \
              --name ehr-frontend \
              --network ehr-net \
              -p 80:80 \
              ehr-frontend
