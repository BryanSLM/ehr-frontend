<div class="flex flex-column">
  <div class="grid gap-1 align-items-start">
    @for (treatment of pagedTreatments; track treatment.id) {
      <div
        class="border border-gray-200 border-round-lg p-4 bg-gray-50 shadow col-5 max-w-30rem min-h-18rem flex flex-column"
      >
        <div class="w-full h-5rem text-overflow-ellipsis overflow-hidden">
          <h2 class="text-blue-500 mb-2">
            {{ treatment.name }}
          </h2>
        </div>
        <p>
          <strong>Medico tratante:</strong>
          {{ treatment.medico.nombres }} {{ treatment.medico.apellidos }}
        </p>
        <div class="mt-auto">
          <button pButton class="w-full" (click)="goToDetails(treatment.id)">
            Ver detalles <i class="pi pi-eye"></i>
          </button>
        </div>
      </div>
    }
  </div>
  <div class="p-4 mt-auto">
    <p-paginator
      [rows]="rows"
      [totalRecords]="treatments.length"
      [first]="first"
      (onPageChange)="onPageChange($event)"
    ></p-paginator>
  </div>
</div>
