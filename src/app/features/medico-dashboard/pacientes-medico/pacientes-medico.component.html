<app-navbar-medico></app-navbar-medico>
<div class="container mt-4">
    <!-- Barra de búsqueda -->
    <div class="row mb-4">
      <div class="col-md-6 offset-md-3">
        <div class="input-group">
          <input
            type="text"
            class="form-control"
            [(ngModel)]="searchTerm"
            placeholder="Buscar paciente..."
            (keyup.enter)="onSearch()"
          >
          <button class="btn btn-primary" (click)="onSearch()">
            <i class="fas fa-search"></i>
          </button>
        </div>
      </div>
    </div>
  
    <!-- Tabla de pacientes -->
    <div class="card">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover">
            <thead>
              <tr>
                <th>Cédula</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Edad</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let patient of patients">
                <td>{{ patient.cedula }}</td>
                <td>{{ patient.primer_nombre }}</td>
                <td>{{ patient.apellido_paterno }}</td>
                <td>{{ calculateAge(patient.fecha_nacimiento) }}</td>
                <td>
                  <button class="btn btn-primary btn-sm" (click)="crearEvolucion(patient.id)">
                    <i class="fas fa-notes-medical me-1"></i>
                    Tomar Evolución
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  
    <!-- Paginación -->
    <nav *ngIf="totalPages > 1" class="mt-4">
      <ul class="pagination justify-content-center">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <a class="page-link" (click)="changePage(currentPage - 1)">Anterior</a>
        </li>
        <li class="page-item" *ngFor="let page of getPages()" [class.active]="page === currentPage" [class.disabled]="page === '...'">
          <a class="page-link" [class.disabled]="page === '...'" (click)="page !== '...' && changePage(page)">{{ page }}</a>
        </li>
        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <a class="page-link" (click)="changePage(currentPage + 1)">Siguiente</a>
        </li>
      </ul>
    </nav>
  </div>
