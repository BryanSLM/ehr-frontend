<div class="w-full h-full">
  <div class="flex w-full">
    <div class="flex flex-column h-full" style="width: 80%">
      <p class="text-5xl font-bold mb-0" style="color: #3b82f6">Inicio</p>
    </div>
    <div
      class="flex align-items-center justify-content-center"
      style="width: 20%"
    ></div>
  </div>
  <div class="grid mt-2">
    <div
      class="col-3 border-round-lg p-4 bg-blue-50 shadow flex flex-column align-items-center justify-content-center"
      style="height: 100%"
    >
      <img
        src="/assets/appointments-icon.png"
        width="100"
        height="100"
        alt="Citas"
      />
      <div class="text-blue-500 text-4xl mt-2 font-bold">Citas</div>
      <div class="text-4xl mt-2 font-bold">{{ counters.citas }}</div>
    </div>
    <div
      class="col-3 border-round-lg p-4 bg-blue-50 shadow flex flex-column align-items-center justify-content-center"
    >
      <img
        src="/assets/labs-icon.png"
        width="100"
        height="100"
        alt="Examenes"
      />
      <div class="text-blue-500 text-4xl mt-2 font-bold">Exámenes</div>
      <div class="text-4xl mt-2 font-bold">{{ counters.labReports }}</div>
    </div>
    <div
      class="col-3 border-round-lg p-4 bg-blue-50 shadow flex flex-column align-items-center justify-content-center"
    >
      <img
        src="/assets/treatments-icon.png"
        width="100"
        height="100"
        alt="Tratamientos"
      />
      <div class="text-blue-500 text-4xl mt-2 font-bold">Tratamientos</div>
      <div class="text-4xl mt-2 font-bold">{{ counters.treatments }}</div>
    </div>
    <div
      class="col-9 mt-2 border-round-lg p-4 bg-blue-50 shadow flex flex-column align-items-center justify-content-center"
    >
      <div class="w-full">
        <canvas
          baseChart
          [data]="barChartData"
          [options]="barChartOptions"
          [type]="'bar'"
          [legend]="true"
          [plugins]="barChartPlugins"
        >
        </canvas>
      </div>
      <div class="text-blue-500 text-4xl mt-2 font-bold">Tus citas por mes</div>
    </div>
  </div>
</div>
